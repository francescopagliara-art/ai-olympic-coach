name: Notorious Morning Alarm

on:
  schedule:
    # Scatta alle 04:00 UTC (corrispondenti alle 06:00 del mattino in Italia)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  send_alarm:
    runs-on: ubuntu-latest
    # FORZATURA STRUTTURALE: Applicata direttamente sul Job per azzerare ogni warning di Node.js
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione Dipendenze
        run: |
          pip install requests openai

      - name: Esecuzione Bot Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python telegram_bot.py